# On a v* tag: run CI on the tagged commit, then build the release zip and publish it as a GitHub
# release with notes from CHANGELOG.md. Nothing is built or uploaded unless CI passes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: ci
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Tag matches the app version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("scripts/xcodeproj-config.json"))["version"])')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in scripts/xcodeproj-config.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release zip
        run: scripts/build-release.sh

      - name: Write release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$VERSION" "build/release/MarkdownQuicklook-$VERSION.zip" > build/release/notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/release/MarkdownQuicklook-$VERSION.zip" \
            --title "MarkdownQuicklook $VERSION" --notes-file build/release/notes.md --verify-tag
