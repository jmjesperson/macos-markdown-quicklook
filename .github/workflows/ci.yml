# Tests and release build for every pull request and every push to main. release.yml reuses this
# workflow, so a tag is only released if the same checks pass on the tagged commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    # A new run for the same trigger and ref (another push to a PR, to main, or a re-pushed tag)
    # cancels the one in progress. Set on the job, with a "ci-" prefix, so that when release.yml calls
    # this workflow the group can't collide with the release's own group and cancel it.
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    # Apple silicon, Xcode 26.6 (17F113): the toolchain the project is developed with.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Xcode project matches its generator config
        run: |
          scripts/generate-xcodeproj.py MarkdownQuicklook.xcodeproj "$(cat scripts/xcodeproj-config.json)"
          git diff --exit-code -- MarkdownQuicklook.xcodeproj

      - name: Renderer tests
        run: swift test --package-path Packages/MarkdownRenderer

      - name: Release build (archive, ad-hoc sign, sandbox and entitlement checks, zip)
        run: scripts/build-release.sh
